name: Update spam list

on:
  schedule:
    # Every day at 17:30 UTC, after the FTC's weekday update (about noon US Eastern).
    - cron: '30 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch the last 7 days of complaints (the FTC publishes days late)
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: python build_spam_list.py fetch --days 7
      - name: Build the 14-day list
        run: python build_spam_list.py build --days 14 --out spam_list.new.csv
      - name: Keep the previous list if the new one looks broken
        run: |
          lines=$(grep -vc '^#' spam_list.new.csv || true)
          echo "numbers in new list: $lines"
          if [ "$lines" -lt 500 ]; then
            echo "::error::new list has only $lines numbers - keeping the previous file"
            exit 1
          fi
          mv spam_list.new.csv spam_list.csv
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A days spam_list.csv
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Update spam list"
          git push
